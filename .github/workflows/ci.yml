name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  go-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Show Go version
        run: go version

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          COMMIT="$(git rev-parse --short=12 HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BUILDINFO_PKG=github.com/MikelCalvo/go-metin2-server/internal/buildinfo
          LDFLAGS="-X ${BUILDINFO_PKG}.Version=${VERSION} -X ${BUILDINFO_PKG}.Commit=${COMMIT} -X ${BUILDINFO_PKG}.BuildDate=${BUILD_DATE}"
          go build -ldflags "${LDFLAGS}" ./cmd/authd
          go build -ldflags "${LDFLAGS}" ./cmd/gamed
          go build -ldflags "${LDFLAGS}" ./cmd/metin2-migrate

  docker-build:
    runs-on: ubuntu-latest
    needs: go-checks
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build runtime image
        run: |
          docker build \
            --build-arg VERSION="${GITHUB_REF_NAME:-dev}" \
            --build-arg COMMIT="$(git rev-parse --short=12 HEAD)" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --target runtime \
            -t go-metin2-server:ci .

      - name: Build debug runtime image
        run: |
          docker build \
            --build-arg VERSION="${GITHUB_REF_NAME:-dev}" \
            --build-arg COMMIT="$(git rev-parse --short=12 HEAD)" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --target runtime-debug \
            -t go-metin2-server:debug-ci .
