name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      changed_docs: ${{ steps.classify.outputs.changed_docs }}
    steps:
      - name: Check out history for change detection
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test CI helper tools
        run: python3 -m unittest discover -s scripts -v

      - name: Classify changed paths
        id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -eu
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ]; then
            # A new branch push has no predecessor, so run the complete suite.
            result='{"docs_only": false, "changed_docs": []}'
          else
            result="$(python3 scripts/ci_change_classifier.py --base "${BASE}" --head "${HEAD}")"
          fi
          echo "${result}"
          RESULT="${result}" python3 -c 'import json, os; result=json.loads(os.environ["RESULT"]); print("docs_only=" + str(result["docs_only"]).lower()); print("changed_docs=" + json.dumps(result["changed_docs"]))' >> "$GITHUB_OUTPUT"

  go-checks:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Show Go version
        run: go version

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      - name: Resolve release identity
        id: identity
        run: |
          set -eu
          if [ -n "${GITHUB_REF_NAME:-}" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          fi
          if [ -n "${GITHUB_SHA:-}" ]; then
            COMMIT="$(printf '%s' "${GITHUB_SHA}" | cut -c1-12)"
          else
            COMMIT="$(git rev-parse --short=12 HEAD 2>/dev/null || echo none)"
          fi
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ -n "${GITHUB_SHA:-}" ] && { [ -z "${COMMIT}" ] || [ "${COMMIT}" = "none" ]; }; then
            echo "GITHUB_SHA was set but resolved COMMIT is empty or 'none'" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "COMMIT=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "Resolved release identity: version=${VERSION} commit=${COMMIT} build_date=${BUILD_DATE}"

      - name: Build binaries
        env:
          VERSION: ${{ steps.identity.outputs.VERSION }}
          COMMIT: ${{ steps.identity.outputs.COMMIT }}
          BUILD_DATE: ${{ steps.identity.outputs.BUILD_DATE }}
        run: |
          set -eu
          BUILDINFO_PKG=github.com/MikelCalvo/go-metin2-server/internal/buildinfo
          LDFLAGS="-X ${BUILDINFO_PKG}.Version=${VERSION} -X ${BUILDINFO_PKG}.Commit=${COMMIT} -X ${BUILDINFO_PKG}.BuildDate=${BUILD_DATE}"
          go build -ldflags "${LDFLAGS}" -o ./authd ./cmd/authd
          go build -ldflags "${LDFLAGS}" -o ./gamed ./cmd/gamed
          go build -ldflags "${LDFLAGS}" -o ./metin2-migrate ./cmd/metin2-migrate
          got_commit="$(./metin2-migrate version | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"])')"
          if [ "${got_commit}" != "${COMMIT}" ]; then
            echo "stamped metin2-migrate commit ${got_commit} != resolved ${COMMIT}" >&2
            exit 1
          fi

  docker-build:
    runs-on: ubuntu-latest
    needs: [changes, go-checks]
    if: needs.changes.result == 'success' && needs.go-checks.result == 'success' && needs.changes.outputs.docs_only != 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release identity
        id: identity
        run: |
          set -eu
          if [ -n "${GITHUB_REF_NAME:-}" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          fi
          if [ -n "${GITHUB_SHA:-}" ]; then
            COMMIT="$(printf '%s' "${GITHUB_SHA}" | cut -c1-12)"
          else
            COMMIT="$(git rev-parse --short=12 HEAD 2>/dev/null || echo none)"
          fi
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ -n "${GITHUB_SHA:-}" ] && { [ -z "${COMMIT}" ] || [ "${COMMIT}" = "none" ]; }; then
            echo "GITHUB_SHA was set but resolved COMMIT is empty or 'none'" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "COMMIT=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "Resolved release identity: version=${VERSION} commit=${COMMIT} build_date=${BUILD_DATE}"

      - name: Build runtime image
        env:
          VERSION: ${{ steps.identity.outputs.VERSION }}
          COMMIT: ${{ steps.identity.outputs.COMMIT }}
          BUILD_DATE: ${{ steps.identity.outputs.BUILD_DATE }}
        run: |
          set -eu
          docker build \
            --build-arg VERSION="${VERSION}" \
            --build-arg COMMIT="${COMMIT}" \
            --build-arg BUILD_DATE="${BUILD_DATE}" \
            --build-arg GITHUB_RUN_ID="${GITHUB_RUN_ID}" \
            --build-arg GITHUB_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT}" \
            --target runtime \
            -t go-metin2-server:ci .
          got_commit="$(docker run --rm --entrypoint /app/metin2-migrate go-metin2-server:ci version | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"])')"
          if [ "${got_commit}" != "${COMMIT}" ]; then
            echo "runtime image metin2-migrate commit ${got_commit} != resolved ${COMMIT}" >&2
            exit 1
          fi
          label_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' go-metin2-server:ci)"
          label_version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' go-metin2-server:ci)"
          label_created="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.created" }}' go-metin2-server:ci)"
          label_run_id="$(docker image inspect --format '{{ index .Config.Labels "com.github.actions.run_id" }}' go-metin2-server:ci)"
          label_run_attempt="$(docker image inspect --format '{{ index .Config.Labels "com.github.actions.run_attempt" }}' go-metin2-server:ci)"
          if [ "${label_revision}" != "${COMMIT}" ]; then
            echo "runtime image revision label ${label_revision} != resolved ${COMMIT}" >&2
            exit 1
          fi
          if [ "${label_version}" != "${VERSION}" ]; then
            echo "runtime image version label ${label_version} != resolved ${VERSION}" >&2
            exit 1
          fi
          if [ "${label_created}" != "${BUILD_DATE}" ]; then
            echo "runtime image created label ${label_created} != resolved ${BUILD_DATE}" >&2
            exit 1
          fi
          if [ "${label_run_id}" != "${GITHUB_RUN_ID}" ]; then
            echo "runtime image run_id label ${label_run_id} != ${GITHUB_RUN_ID}" >&2
            exit 1
          fi
          if [ "${label_run_attempt}" != "${GITHUB_RUN_ATTEMPT}" ]; then
            echo "runtime image run_attempt label ${label_run_attempt} != ${GITHUB_RUN_ATTEMPT}" >&2
            exit 1
          fi

      - name: Build debug runtime image
        env:
          VERSION: ${{ steps.identity.outputs.VERSION }}
          COMMIT: ${{ steps.identity.outputs.COMMIT }}
          BUILD_DATE: ${{ steps.identity.outputs.BUILD_DATE }}
        run: |
          set -eu
          docker build \
            --build-arg VERSION="${VERSION}" \
            --build-arg COMMIT="${COMMIT}" \
            --build-arg BUILD_DATE="${BUILD_DATE}" \
            --build-arg GITHUB_RUN_ID="${GITHUB_RUN_ID}" \
            --build-arg GITHUB_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT}" \
            --target runtime-debug \
            -t go-metin2-server:debug-ci .
          got_commit="$(docker run --rm --entrypoint /app/metin2-migrate go-metin2-server:debug-ci version | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"])')"
          if [ "${got_commit}" != "${COMMIT}" ]; then
            echo "debug image metin2-migrate commit ${got_commit} != resolved ${COMMIT}" >&2
            exit 1
          fi
          label_revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' go-metin2-server:debug-ci)"
          label_version="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' go-metin2-server:debug-ci)"
          label_created="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.created" }}' go-metin2-server:debug-ci)"
          label_run_id="$(docker image inspect --format '{{ index .Config.Labels "com.github.actions.run_id" }}' go-metin2-server:debug-ci)"
          label_run_attempt="$(docker image inspect --format '{{ index .Config.Labels "com.github.actions.run_attempt" }}' go-metin2-server:debug-ci)"
          if [ "${label_revision}" != "${COMMIT}" ]; then
            echo "debug image revision label ${label_revision} != resolved ${COMMIT}" >&2
            exit 1
          fi
          if [ "${label_version}" != "${VERSION}" ]; then
            echo "debug image version label ${label_version} != resolved ${VERSION}" >&2
            exit 1
          fi
          if [ "${label_created}" != "${BUILD_DATE}" ]; then
            echo "debug image created label ${label_created} != resolved ${BUILD_DATE}" >&2
            exit 1
          fi
          if [ "${label_run_id}" != "${GITHUB_RUN_ID}" ]; then
            echo "debug image run_id label ${label_run_id} != ${GITHUB_RUN_ID}" >&2
            exit 1
          fi
          if [ "${label_run_attempt}" != "${GITHUB_RUN_ATTEMPT}" ]; then
            echo "debug image run_attempt label ${label_run_attempt} != ${GITHUB_RUN_ATTEMPT}" >&2
            exit 1
          fi

  docs-links:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.result == 'success'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check changed Markdown links
        env:
          CHANGED_DOCS: ${{ needs.changes.outputs.changed_docs }}
        run: |
          set -eu
          CHANGED_DOCS="${CHANGED_DOCS}" python3 -c '
          import json, os, subprocess
          files = json.loads(os.environ["CHANGED_DOCS"])
          if not files: raise SystemExit(0)
          raise SystemExit(subprocess.run(["python3", "scripts/check_markdown_links.py", *files]).returncode)
          '

  verify:
    # Stable aggregate check; repository admins can require this in protection.
    # Adding the job does not itself modify GitHub branch protection.
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, go-checks, docker-build, docs-links]
    steps:
      - name: Verify the applicable checks
        env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          CHANGES: ${{ needs.changes.result }}
          GO: ${{ needs.go-checks.result }}
          DOCKER: ${{ needs.docker-build.result }}
          DOCS: ${{ needs.docs-links.result }}
        run: |
          set -eu
          echo "changes=${CHANGES} go=${GO} docker=${DOCKER} docs=${DOCS} docs_only=${DOCS_ONLY}"
          if [ "${CHANGES}" != success ]; then
            exit 1
          fi
          if [ "${DOCS_ONLY}" = true ]; then
            [ "${DOCS}" = success ]
            [ "${GO}" = skipped ]
            [ "${DOCKER}" = skipped ]
          else
            [ "${GO}" = success ]
            [ "${DOCKER}" = success ]
            [ "${DOCS}" = success ]
          fi
